server:
    host: "0.0.0.0"
    port: 3000
    base_url: "https://<url-to-your-headplane>"
    data_path: "/var/lib/headplane"
    cookie_secret: "32-character-long-random-string"
    cookie_secure: true

headscale:
    url: "https://<headscale.example.com>"
    api_key: "your-headscale-api-key"
    config_path: "/etc/headscale/config.yaml"
    config_strict: true

integration:
    docker:
        enabled: true
        container_name: "headscale"
        socket: "unix:///var/run/docker.sock"

oidc:
  issuer: "https://<authelia.example.com>"
  client_id: "headplane"

  # The client secret for the OIDC client
  # Either this or `client_secret_path` must be set for OIDC to work
  client_secret: "some-random-client-secret"

  disable_api_key_login: false
  token_endpoint_auth_method: "client_secret_post"