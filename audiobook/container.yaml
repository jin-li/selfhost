schema: 1
service: audiobook
projectName: audiobook
compose:
  root: selfhost/audiobook
  base: [docker-compose.yml]
environment:
  WEB_ORIGIN:
    source: host.services.audiobook.webOrigin
    required: true
    type: string
    secret: false
  WEB_BASE_PATH:
    source: host.services.audiobook.webBasePath
    required: true
    type: string
    secret: false
  LISTEN_URL:
    source: host.services.audiobook.listenUrl
    required: true
    type: string
    secret: false
  CALIBRE_LIBRARY:
    source: host.services.audiobook.sourcePath
    required: true
    type: string
    secret: false
  STATE_DIR:
    source: host.services.audiobook.statePath
    required: true
    type: string
    secret: false
  LIBRARY_DIR:
    source: host.services.audiobook.libraryPath
    required: true
    type: string
    secret: false
  PROFILES_FILE:
    source: host.services.audiobook.profilesFile
    required: true
    type: string
    secret: false
files: {}
networks:
  required: [traefik-net]
placement:
  allowedHosts: ["*"]
  mode: singleton
autostart: true
data:
  declarations:
    - name: job-state
      source: host.services.audiobook.statePath
      containerPath: /state
      backupNotes: Retain source snapshots, manifests, and unfinished chunks. Finished temporary audio is removed after publication.
    - name: audiobook-output
      source: host.services.audiobook.libraryPath
      containerPath: /library
      backupNotes: Back up completed M4B files with Audiobookshelf state.
validation:
  healthChecks: []
