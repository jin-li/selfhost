services:
  picard:
    image: jlesage/musicbrainz-picard:v26.07.1
    container_name: picard
    environment:
      USER_ID: "1000"
      GROUP_ID: "100"
      TZ: ${TZ}
      KEEP_APP_RUNNING: "1"
      WEB_AUDIO: "1"
      WEB_FILE_MANAGER: "1"
      WEB_FILE_MANAGER_ALLOWED_PATHS: /storage/staging
      WEB_TERMINAL: "0"
    volumes:
      - ${CONFIG_DIR}:/config
      - ${STAGING_DIR}:/storage/staging
      - ${MUSIC_DIR}:/storage/library:ro
    networks:
      - traefik-net
    restart: unless-stopped
networks:
  traefik-net:
    external: true
