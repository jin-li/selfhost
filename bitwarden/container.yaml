schema: 1
service: bitwarden
projectName: bitwarden
compose:
  root: selfhost/bitwarden
  base:
    - docker-compose.yml
environment:
  BITWARDEN_DATA_DIR:
    source: host.services.bitwarden.dataPath
    required: true
    type: string
    secret: false
  BW_DOMAIN:
    source: host.services.bitwarden.domain
    required: true
    type: string
    secret: false
  DISABLE_USER_REGISTRATION:
    source: host.services.bitwarden.disableUserRegistration
    required: true
    type: boolean
    secret: false
  BW_INSTALLATION_ID:
    source:
      scope: service
      path: env.yaml
      key: BW_INSTALLATION_ID
      format: yaml
    required: true
    type: string
    secret: true
  BW_INSTALLATION_KEY:
    source:
      scope: service
      path: env.yaml
      key: BW_INSTALLATION_KEY
      format: yaml
    required: true
    type: string
    secret: true
files: {}
networks:
  required:
    - traefik-net
data:
  declarations:
    - name: bitwarden-data
      source: host.services.bitwarden.dataPath
      containerPath: /etc/bitwarden
      backupNotes: Stop Bitwarden before copying its SQLite database, attachments, and configuration; keep a verified export or SQLite backup for recovery.
validation:
  healthChecks:
    - name: bitwarden-alive
      command: ["curl", "--silent", "--fail", "http://localhost:8080/alive"]
placement:
  allowedHosts:
    - t460s
  mode: singleton
autostart: true
compatibilityPaths:
  - selfhost/bitwarden/.env
