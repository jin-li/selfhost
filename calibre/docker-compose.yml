---
version: "2.1"
services:
  calibre-web:
    image: linuxserver/calibre-web:0.6.24
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}:/config
      - ${LIBRARY_DIR}:/books
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      traefik-net:
        aliases:
          - calibre-web
    labels:
      # Calibre-Web is on 0.x; the repository also holds stray 2021 tags such as 5.33.2.
      - wud.tag.include=^0\.\d+\.\d+$$

networks:
  traefik-net:
    external: true