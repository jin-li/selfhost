schema: 1
service: cv
projectName: cv-hugo
compose:
  root: private/cv-hugo
  base:
    - docker-compose.yml
  hostOverlay: local/{host}/cv/compose.{host}.yaml
environment: {}
files: {}
networks:
  required:
    - traefik-net
data:
  declarations: []
validation:
  healthChecks:
    - name: nginx-config
      command: ["nginx", "-t"]
placement:
  allowedHosts: [t460s]
  mode: singleton
autostart: false
compatibilityPaths: []
