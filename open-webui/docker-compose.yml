version: "3.9"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.6
    container_name: open-webui
    volumes:
      - ${DATA_DIR}:/app/backend/data
    environment:
      - TZ=${TZ:-UTC}
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=false
    restart: unless-stopped
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$$
    networks:
      traefik-net:
        aliases:
          - open-webui

networks:
  traefik-net:
    external: true
