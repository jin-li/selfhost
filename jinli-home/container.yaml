schema: 1
service: jinli-home
projectName: jinli-home
compose:
  root: private/jinli-home
  base:
    - docker-compose.yml
  hostOverlay: local/{host}/jinli-home/compose.{host}.yaml
environment: {}
files: {}
networks:
  required:
    - traefik-net
data:
  declarations: []
validation:
  healthChecks:
    - name: node-version
      command: ["node", "--version"]
placement:
  allowedHosts: [t460s]
  mode: singleton
autostart: false
compatibilityPaths: []
