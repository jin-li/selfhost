version: '3.8'

services:
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:2026.3.18-3810dc9d1
    restart: unless-stopped
    labels:
      # Releases are tagged YYYY.M.D-<commit>.
      - wud.tag.include=^\d{4}\.\d{1,2}\.\d{1,2}-[0-9a-f]+$$
    volumes:
      - ./searxng:/etc/searxng:ro
      - ./searxng_data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      traefik-net:
        aliases:
          - searxng

networks:
  traefik-net:
    external: true
