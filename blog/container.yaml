schema: 1
service: blog
projectName: blog-blowfish
compose:
  root: private/blog-blowfish
  base:
    - docker-compose.yml
  hostOverlay: local/{host}/blog/compose.{host}.yaml
environment: {}
files: {}
networks:
  required:
    - traefik-net
data:
  declarations: []
validation:
  healthChecks:
    - name: nginx-config
      command: ["nginx", "-t"]
placement:
  allowedHosts: [t460s]
  mode: singleton
autostart: false
compatibilityPaths: []
