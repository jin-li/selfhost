schema: 1
service: portainer
projectName: portainer
compose:
  root: selfhost/portainer
  base:
    - docker-compose.yml
  hostOverlay: local/{host}/portainer/compose.{host}.yaml
environment: {}
files: {}
networks:
  required:
    - traefik-net
data:
  declarations:
    - name: portainer-data
      source: host.services.portainer.dataPath
      containerPath: /data
      backupNotes: Stop Portainer before copying its complete bind-mounted state.
validation:
  healthChecks:
    - name: portainer-version
      command: ["/portainer", "--version"]
placement:
  allowedHosts: [surf, t460s]
  mode: singleton
autostart: false
compatibilityPaths: []
