services:
  whatsupdocker:
    image: getwud/wud:9.9.0
    container_name: wud
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WUD_AUTH_BASIC_ADMIN_USER=${WUD_AUTH_BASIC_ADMIN_USER}
      - WUD_AUTH_BASIC_ADMIN_HASH=${WUD_AUTH_BASIC_ADMIN_HASH}
      # Soak period: report a release only after it is this old.
      - WUD_WATCHER_LOCAL_DELAY=${WUD_WATCHER_DELAY:-7d}
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$$
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true