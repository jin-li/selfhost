schema: 1
service: authelia
projectName: authelia
compose:
  root: selfhost/authelia
  base:
    - docker-compose.yml
  hostOverlay: null
environment:
  DATA_DIR:
    source: host.services.authelia.dataPath
    required: true
    type: string
    secret: false
  TZ:
    source: host.timezone
    required: true
    type: string
    secret: false
  STORAGE_ENCRYPTION_KEY:
    source:
      scope: service
      path: env.yaml
      key: STORAGE_ENCRYPTION_KEY
      format: yaml
    required: true
    type: string
    secret: true
  SESSION_SECRET:
    source:
      scope: service
      path: env.yaml
      key: SESSION_SECRET
      format: yaml
    required: false
    type: string
    secret: true
  JWT_SECRET:
    source:
      scope: service
      path: env.yaml
      key: JWT_SECRET
      format: yaml
    required: true
    type: string
    secret: true
  HMAC_SECRET:
    source:
      scope: service
      path: env.yaml
      key: HMAC_SECRET
      format: yaml
    required: true
    type: string
    secret: true
  HEADPLANE_CLIENT_SECRET:
    source:
      scope: service
      path: env.yaml
      key: HEADPLANE_CLIENT_SECRET
      format: yaml
    required: true
    type: string
    secret: true
  HEADSCALE_CLIENT_SECRET:
    source:
      scope: service
      path: env.yaml
      key: HEADSCALE_CLIENT_SECRET
      format: yaml
    required: true
    type: string
    secret: true
  FRANKMD_CLIENT_SECRET:
    source:
      scope: service
      path: env.yaml
      key: FRANKMD_CLIENT_SECRET
      format: yaml
    required: true
    type: string
    secret: true
  JINLI_HOME_CLIENT_SECRET:
    source:
      scope: service
      path: env.yaml
      key: JINLI_HOME_CLIENT_SECRET
      format: yaml
    required: true
    type: string
    secret: true
files:
  jwksKey:
    source:
      scope: service
      path: files/jwks.key
      format: binary
    target: jwks.key
    secret: true
    required: true
    mode: "0400"
  users:
    source:
      scope: service
      path: files/users.yml
      format: binary
    target: users.yml
    secret: true
    required: true
    mode: "0400"
networks:
  required:
    - traefik-net
data:
  declarations:
    - name: authelia-data
      source: host.services.authelia.dataPath
      containerPath: /data
      backupNotes: Stop Authelia before copying its bind-mounted data directory containing SQLite database and logs.
validation:
  healthChecks:
    - name: authelia-health
      command: ["wget", "-q", "--spider", "http://localhost:9091/api/health"]
placement:
  allowedHosts: [t460s]
  mode: singleton
autostart: true
compatibilityPaths:
  - selfhost/authelia/.env
  - selfhost/authelia/config/configuration.yml
  - selfhost/authelia/config/users.yml