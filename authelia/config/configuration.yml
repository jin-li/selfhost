###############################################################
#                   Authelia configuration                    #
###############################################################
server:
    address: tcp://0.0.0.0:9091/
    buffers:
        read: 4096
        write: 4096
    endpoints:
        enable_pprof: false
        enable_expvars: false
    disable_healthcheck: false
# https://www.authelia.com/configuration/miscellaneous/logging/
log:
    level: info
    format: text
    file_path: /data/authelia.log
    keep_stdout: true
# https://www.authelia.com/configuration/second-factor/time-based-one-time-password/
totp:
    issuer: authelia.com
    period: 30
    skew: 1
# AUTHELIA_DUO_PLACEHOLDER
# https://www.authelia.com/reference/guides/passwords/
authentication_backend:
    password_reset:
        disable: false
    refresh_interval: 5m
    file:
        path: /config/users.yml
        password:
            algorithm: argon2id
            iterations: 1
            salt_length: 16
            parallelism: 8
            # blocks this much of the RAM
            memory: 256
# https://www.authelia.com/overview/authorization/access-control/
access_control:
    default_policy: deny
    rules:
        # - domain:
        #     - "*.example.com"
        #     - "example.com"
        #   policy: bypass
        #   networks: # bypass authentication for local networks
        #     - 10.0.0.0/8
        #     - 192.168.0.0/16
        #     - 172.16.0.0/12
        - domain:
            - '*.jinli.io'
            - jinli.io
          policy: one_factor
# https://www.authelia.com/configuration/session/introduction/
session:
    secret: '${SESSION_SECRET}'
    name: authelia_session
    same_site: lax
    expiration: 7h
    inactivity: 5m
    remember_me: 1M
    cookies:
        - domain: jinli.io
          authelia_url: https://auth.jinli.io
          default_redirection_url: https://jinli.io
# https://www.authelia.com/configuration/security/regulation/
regulation:
    max_retries: 3
    find_time: 10m
    ban_time: 12h
# https://www.authelia.com/configuration/storage/introduction/
storage:
    # For local storage, uncomment lines below and comment out mysql. https://docs.authelia.com/configuration/storage/sqlite.html
    # This is good for the beginning. If you have a busy site then switch to other databases.
    encryption_key: '${STORAGE_ENCRYPTION_KEY}'
    local:
        path: /data/db.sqlite3
# https://www.authelia.com/configuration/notifications/introduction/
notifier:
    disable_startup_check: false
    # For testing purposes, notifications can be sent in a file. Be sure to map the volume in docker-compose.
    filesystem:
        filename: /data/notifications.txt
# https://www.authelia.com/configuration/identity-validation/introduction/
identity_validation:
    reset_password:
        jwt_secret: '${JWT_SECRET}'
# https://www.authelia.com/configuration/identity-providers/openid-connect/provider/
identity_providers:
    oidc:
        hmac_secret: '${HMAC_SECRET}'
        jwks:
            - key_id: headplane
              algorithm: RS256
              use: sig
              key_file: /config/jwks.key
        clients:
            - client_id: headplane
              client_name: Headplane OIDC Client
              client_secret: '${HEADPLANE_CLIENT_SECRET}'
              public: false
              authorization_policy: one_factor
              redirect_uris:
                - https://net.jinli.io/admin/oidc/callback
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              token_endpoint_auth_method: client_secret_post
            - client_id: headscale
              client_name: Headscale OIDC Client
              client_secret: '${HEADSCALE_CLIENT_SECRET}'
              public: false
              authorization_policy: one_factor
              redirect_uris:
                - https://headscale.jinli.io/oidc/callback
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              token_endpoint_auth_method: client_secret_post
            - client_id: frankmd
              client_name: FrankMD OIDC Client
              client_secret: '${FRANKMD_CLIENT_SECRET}'
              public: false
              authorization_policy: one_factor
              redirect_uris:
                - https://md.jinli.io/auth/openid_connect/callback
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              token_endpoint_auth_method: client_secret_post
            - client_id: jinli-home
              client_name: jinli-home OIDC Client
              client_secret: '${JINLI_HOME_CLIENT_SECRET}'
              public: false
              authorization_policy: one_factor
              redirect_uris:
                - https://jinli.io/auth/openid_connect/callback
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              token_endpoint_auth_method: client_secret_post