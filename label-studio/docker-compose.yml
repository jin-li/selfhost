version: "3.9"

services:
  app:
    image: heartexlabs/label-studio:1.23.0
    container_name: label
    restart: unless-stopped
    stdin_open: true
    tty: true
    expose:
      - "8000"
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - POSTGRES_NAME=postgres
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=db
      - JSON_LOG=1
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APP_DATA}:/label-studio/data
    command: label-studio-uwsgi
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$$
      - wud.tag.transform=^(\d+\.\d+)\.\d+$$ => $$1
    networks:
      - traefik-net
      - label-studio-net

  db:
    image: pgautoupgrade/pgautoupgrade:13-alpine
    container_name: label-db
    hostname: db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA}:/var/lib/postgresql/data
    labels:
      - wud.watch=false
    networks:
      - label-studio-net

networks:
  label-studio-net:
  traefik-net:
    external: true
